[project]
name = "aisv"
version = "0.1.0"
description = "Track whether AI answer engines mention, rank, and cite a brand."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "John Shum" }]
keywords = ["seo", "aeo", "geo", "answer-engines", "visibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.2",
    "ruff>=0.6",
    "types-PyYAML>=6",
]

[project.urls]
Homepage = "https://github.com/photosnob/ai-search-visibility"
Repository = "https://github.com/photosnob/ai-search-visibility"

[project.scripts]
aisv = "aisv.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aisv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["×", "−"]

[tool.ruff.lint.per-file-ignores]
"src/aisv/html_report.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aisv"]
mypy_path = "src"
warn_unreachable = true
